<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalist</title>
</head>
<body>
    <h2>Select your country</h2>
    <input list="countries" placeholder="Enter your country">
    <datalist id="countries">
        <option value="India">
        <option value="USA">
        <option value="Chaina">
        <option value="Russia">
        <option value="London">    
        <option value="UK">

    </datalist>
</body>
</html>
